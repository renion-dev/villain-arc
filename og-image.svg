<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" style="stop-color:#1a0a0f"/>
      <stop offset="100%" style="stop-color:#050505"/>
    </radialGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2d55"/>
      <stop offset="100%" style="stop-color:#bf5af2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="250" r="150" fill="none" stroke="#ff2d55" stroke-width="1" opacity="0.3"/>
  <circle cx="600" cy="250" r="120" fill="none" stroke="#bf5af2" stroke-width="0.5" opacity="0.2"/>
  <text x="600" y="200" font-family="serif" font-size="80" font-weight="900" fill="url(#text)" text-anchor="middle" filter="url(#glow)">VILLAIN ARC</text>
  <text x="600" y="300" font-family="serif" font-size="30" font-style="italic" fill="#a0a0a0" text-anchor="middle">The Cinematic Origin</text>
  <text x="600" y="450" font-family="sans-serif" font-size="16" fill="#666" text-anchor="middle">Discover your inner villain</text>
</svg>