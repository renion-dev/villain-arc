<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050505;--card:#0a0a0a;--text:#f0f0f0;--text2:#a0a0a0;--text3:#666;
  --accent:#ff2d55;--accent2:#bf5af2;--accent3:#30d158;--accent4:#ff9f0a;--accent5:#64d2ff;
  --font-display:'Cinzel',serif;--font-body:'Inter',sans-serif;--font-quote:'Cormorant Garamond',Georgia,serif;
}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--bg);font-family:var(--font-display);color:var(--text);touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ===== UI LAYOUT ===== */
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:10}

/* Top Bar */
#top-bar{position:fixed;top:0;left:0;right:0;padding:1rem 1.5rem;background:linear-gradient(180deg,rgba(5,5,5,0.9) 0%,rgba(5,5,5,0.4) 70%,transparent 100%);z-index:20;display:flex;justify-content:space-between;align-items:flex-start;backdrop-filter:blur(10px)}
.brand{display:flex;flex-direction:column;gap:0.2rem}
.brand-title{font-size:0.85rem;font-weight:700;letter-spacing:0.3em;color:var(--accent);text-shadow:0 0 20px rgba(255,45,85,0.5)}
.brand-sub{font-family:var(--font-body);font-size:0.6rem;color:var(--text3);letter-spacing:0.1em}
.top-stats{display:flex;gap:1.2rem;align-items:center}
.stat-item{display:flex;flex-direction:column;align-items:center;gap:0.1rem}
.stat-val{font-family:var(--font-body);font-size:1rem;font-weight:600;color:var(--text)}
.stat-label{font-family:var(--font-body);font-size:0.55rem;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase}

/* Main Stage */
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;pointer-events:none;opacity:0;transition:opacity 2s cubic-bezier(0.4,0,0.2,1)}
#stage.active{opacity:1;pointer-events:auto}

/* Title Screen */
.title-wrap{text-align:center;max-width:90vw}
.title-main{font-size:clamp(3rem,14vw,8rem);font-weight:900;letter-spacing:0.25em;line-height:1.1;background:linear-gradient(135deg,#fff 0%,#ff2d55 50%,#bf5af2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 40px rgba(255,45,85,0.4));animation:title-shine 4s ease-in-out infinite alternate}
@keyframes title-shine{0%{filter:drop-shadow(0 0 40px rgba(255,45,85,0.4))}100%{filter:drop-shadow(0 0 60px rgba(255,45,85,0.7)) drop-shadow(0 0 100px rgba(191,90,242,0.3))}}
.title-sub{font-family:var(--font-display);font-size:clamp(0.8rem,2.5vw,1.2rem);color:var(--text2);letter-spacing:0.5em;text-transform:uppercase;margin-top:0.5rem}
.title-tagline{font-family:var(--font-quote);font-size:clamp(0.9rem,2.5vw,1.3rem);font-style:italic;color:var(--text3);margin-top:1rem;letter-spacing:0.1em}

/* Input */
.input-section{display:flex;flex-direction:column;align-items:center;gap:1.5rem;margin-top:2rem}
#name-input{background:transparent;border:none;border-bottom:2px solid rgba(255,45,85,0.3);color:var(--text);font-family:var(--font-display);font-size:clamp(1.2rem,4vw,1.8rem);text-align:center;padding:0.8rem 1.5rem;outline:none;width:85vw;max-width:450px;letter-spacing:0.15em;transition:all 0.4s ease}
#name-input:focus{border-bottom-color:var(--accent);box-shadow:0 4px 20px rgba(255,45,85,0.2)}
#name-input::placeholder{color:var(--text3);font-size:clamp(0.7rem,2vw,1rem)}
.btn-reveal{background:transparent;border:2px solid var(--accent);color:var(--accent);font-family:var(--font-display);font-size:clamp(0.75rem,2vw,1rem);font-weight:600;letter-spacing:0.3em;padding:1rem 2.5rem;cursor:pointer;text-transform:uppercase;transition:all 0.5s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden;opacity:0;pointer-events:none}
.btn-reveal.show{opacity:1;pointer-events:auto}
.btn-reveal::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,45,85,0.15),transparent);transition:left 0.6s}
.btn-reveal:hover::before{left:100%}
.btn-reveal:hover{background:var(--accent);color:var(--bg);box-shadow:0 0 50px rgba(255,45,85,0.5);transform:scale(1.05)}
.btn-reveal:active{transform:scale(0.97)}

/* Bottom Bar */
#bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:1rem 1.5rem;background:linear-gradient(0deg,rgba(5,5,5,0.9) 0%,rgba(5,5,5,0.4) 70%,transparent 100%);z-index:20;display:flex;justify-content:center;gap:0.8rem;flex-wrap:wrap;backdrop-filter:blur(10px)}
.nav-btn{background:rgba(255,45,85,0.08);border:1px solid rgba(255,45,85,0.2);color:var(--accent);font-family:var(--font-display);font-size:0.65rem;font-weight:600;letter-spacing:0.15em;padding:0.6rem 1.2rem;cursor:pointer;text-transform:uppercase;transition:all 0.3s;border-radius:4px}
.nav-btn:hover{background:rgba(255,45,85,0.2);border-color:var(--accent);box-shadow:0 0 20px rgba(255,45,85,0.2)}
.nav-btn:disabled{opacity:0.3;cursor:not-allowed}
.nav-btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.nav-btn.primary:hover{background:#ff4d6f}

/* Modals */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:100;align-items:center;justify-content:center;padding:1.5rem;backdrop-filter:blur(8px)}
.modal-overlay.active{display:flex}
.modal{background:var(--card);border:1px solid rgba(255,45,85,0.15);border-radius:12px;padding:2rem;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.8),0 0 80px rgba(255,45,85,0.08)}
.modal-close{position:absolute;top:0.8rem;right:1.2rem;font-size:1.5rem;color:var(--text3);cursor:pointer;transition:color 0.3s;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-title{font-size:1.3rem;font-weight:700;letter-spacing:0.15em;text-align:center;color:var(--accent);margin-bottom:1.5rem}

/* Gallery Grid */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0.8rem}
.gallery-card{background:rgba(255,45,85,0.04);border:1px solid rgba(255,45,85,0.1);border-radius:8px;padding:1rem;text-align:center;transition:all 0.3s;cursor:pointer}
.gallery-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 5px 20px rgba(255,45,85,0.15)}
.gallery-name{font-size:0.8rem;font-weight:700;color:var(--text);margin-bottom:0.3rem}
.gallery-epithet{font-family:var(--font-quote);font-size:0.7rem;font-style:italic;color:var(--accent2)}
.gallery-threat{font-family:var(--font-display);font-size:0.7rem;font-weight:700}
.gallery-rarity{font-family:var(--font-body);font-size:0.6rem;text-transform:uppercase;letter-spacing:0.1em;margin-top:0.3rem}
.gallery-faction{font-family:var(--font-body);font-size:0.55rem;margin-top:0.2rem;opacity:0.7}
.empty-msg{grid-column:1/-1;text-align:center;color:var(--text3);font-style:italic;padding:2rem;font-family:var(--font-body);font-size:0.85rem}

/* Achievements */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.8rem}
.ach-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:1.2rem 0.8rem;text-align:center;transition:all 0.3s}
.ach-card.unlocked{background:rgba(255,45,85,0.06);border-color:rgba(255,45,85,0.25);box-shadow:0 0 15px rgba(255,45,85,0.1)}
.ach-icon{font-size:1.8rem;display:block;margin-bottom:0.4rem}
.ach-name{font-size:0.7rem;font-weight:700;color:var(--text)}
.ach-desc{font-family:var(--font-body);font-size:0.6rem;color:var(--text3);margin-top:0.2rem;line-height:1.4}

/* Daily Card */
.daily-card{background:rgba(255,45,85,0.04);border:1px solid rgba(255,45,85,0.12);border-radius:10px;padding:2rem;text-align:center;margin:1rem 0}
.daily-name{font-size:1.5rem;font-weight:900;color:var(--text)}
.daily-epithet{font-family:var(--font-quote);font-size:1rem;font-style:italic;color:var(--accent2);margin:0.5rem 0}
.daily-power{font-size:0.85rem;color:var(--accent3)}
.daily-threat{font-size:0.9rem;font-weight:700;margin-top:0.5rem}
.daily-quote{font-family:var(--font-quote);font-size:0.9rem;font-style:italic;color:var(--text2);margin-top:1rem;line-height:1.6}

/* Controls */
.control-row{display:flex;gap:0.5rem;align-items:center}
.ctrl-btn{background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);color:var(--text2);font-family:var(--font-display);font-size:0.6rem;font-weight:600;letter-spacing:0.1em;padding:0.5rem 0.8rem;cursor:pointer;text-transform:uppercase;transition:all 0.3s;border-radius:4px}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent)}
.ctrl-btn.recording{border-color:var(--accent);color:#fff;animation:rec-pulse 1.2s infinite}
@keyframes rec-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,45,85,0.5)}50%{box-shadow:0 0 0 8px rgba(255,45,85,0)}}

/* Achievement Toast */
#ach-toast{position:fixed;top:4rem;left:50%;transform:translateX(-50%);z-index:200;opacity:0;transition:opacity 0.4s;pointer-events:none}
#ach-toast.show{opacity:1}
.ach-toast-inner{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:0.8rem 1.5rem;border-radius:8px;display:flex;align-items:center;gap:0.8rem;box-shadow:0 8px 30px rgba(255,45,85,0.4)}
.ach-toast-icon{font-size:1.3rem}
.ach-toast-text{font-size:0.8rem;font-weight:700;letter-spacing:0.08em;color:#fff}

/* Result Card */
.result-text{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity 1.5s;z-index:15;width:90vw}
.result-text.show{opacity:1}
.result-main{font-size:clamp(1.2rem,4vw,2rem);font-weight:700;letter-spacing:0.1em;text-shadow:0 0 20px rgba(255,45,85,0.6)}
.result-sub{display:block;font-family:var(--font-body);font-size:0.7rem;color:var(--text2);letter-spacing:0.15em;margin-top:0.5rem;font-weight:400}

/* Progress */
.progress-wrap{position:fixed;bottom:3.5rem;left:50%;transform:translateX(-50%);width:200px;text-align:center}
.progress-bar{height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width 0.5s ease}
.progress-label{font-family:var(--font-body);font-size:0.55rem;color:var(--text3);margin-top:0.3rem;letter-spacing:0.1em}

/* Nemesis Banner */
#nemesis-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);background:rgba(5,5,5,0.96);border:3px solid var(--accent);padding:2.5rem 4rem;border-radius:12px;z-index:90;text-align:center;opacity:0;pointer-events:none;transition:all 0.5s cubic-bezier(0.4,0,0.2,1);box-shadow:0 0 80px rgba(255,45,85,0.5)}
#nemesis-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.nemesis-icon{font-size:2.5rem;animation:pulse 0.8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.nemesis-text{font-size:1.5rem;font-weight:900;letter-spacing:0.25em;color:var(--accent);text-shadow:0 0 20px rgba(255,45,85,0.6);margin-top:0.5rem}

/* Toast */
#toast{position:fixed;top:4rem;left:50%;transform:translateX(-50%);background:rgba(255,45,85,0.9);color:#fff;font-family:var(--font-body);font-size:0.75rem;letter-spacing:0.08em;padding:0.7rem 1.5rem;border-radius:6px;z-index:200;opacity:0;transition:opacity 0.4s}
#toast.show{opacity:1}

/* Responsive */
@media(max-width:600px){
  #top-bar{padding:0.8rem 1rem}
  .brand-title{font-size:0.7rem}
  .top-stats{gap:0.8rem}
  .stat-val{font-size:0.85rem}
  #bottom-bar{padding:0.8rem 1rem;gap:0.5rem}
  .nav-btn{padding:0.5rem 0.9rem;font-size:0.6rem}
  .modal{padding:1.5rem}
  .title-main{letter-spacing:0.15em}
  #nemesis-banner{padding:2rem 3rem}
  .nemesis-text{font-size:1.2rem}
}
</style>
</head>

<script>
// ===== VILLAIN ARC ENGINE v4.2 =====
'use strict';

// Canvas Setup
const cv = document.getElementById('stage-canvas'), ctx = cv.getContext('2d');
let W, H, dpr;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

// Deterministic Hash
function hash(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return h >>> 0; }
function rng(s) { return () => { s += 0x6D2B79F5; s = Math.imul(s ^ s >>> 15, s | 1); s ^= s + Math.imul(s ^ s >>> 7, s | 61); return ((s ^ s >>> 14) >>> 0) / 4294967296; }; }

const RARITY = {
  common:    { name: 'Common',    color: '#a0a0a0', chance: 50, glow: 'none' },
  uncommon:  { name: 'Uncommon',  color: '#30d158', chance: 30, glow: '0 0 15px rgba(48,209,88,0.4)' },
  rare:      { name: 'Rare',      color: '#64d2ff', chance: 12, glow: '0 0 20px rgba(100,210,255,0.5)' },
  epic:      { name: 'Epic',      color: '#bf5af2', chance: 5,  glow: '0 0 25px rgba(191,90,242,0.6)' },
  legendary: { name: 'Legendary', color: '#ff9f0a', chance: 2,  glow: '0 0 30px rgba(255,159,10,0.7)' },
  mythic:    { name: 'Mythic',    color: '#ff2d55', chance: 1,  glow: '0 0 40px rgba(255,45,85,0.8)' }
};

function rollRarity(r) {
  const roll = r() * 100;
  let cumulative = 0;
  for (const [key, val] of Object.entries(RARITY)) {
    cumulative += val.chance;
    if (roll < cumulative) return key;
  }
  return 'common';
}

};

let synth = null;
let currentUtterance = null;

function initSpeech() {
  if (synth) return;
  synth = window.speechSynthesis;
}

function narrateStory(voiceType = 'dramatic') {
  if (!arc || !synth) return;
  
  // Stop any current narration
  synth.cancel();
  
  const voice = VOICES[voiceType] || VOICES['dramatic'];
  
  // Build narration text
  const text = `Behold the origin of ${arc.villainName}, "${arc.epithet}". ${arc.backstory} Threat level: ${arc.threat.l}. Power: ${arc.power}. ${arc.quote}`;
  
  currentUtterance = new SpeechSynthesisUtterance(text);
  currentUtterance.rate = voice.rate;
  currentUtterance.pitch = voice.pitch;
  currentUtterance.lang = voice.lang;
  
  // Try to find a matching voice
  const voices = synth.getVoices();
  const match = voices.find(v => v.lang.includes('en') && v.name.toLowerCase().includes('male')) || voices[0];
  if (match) currentUtterance.voice = match;
  
  synth.speak(currentUtterance);
}

function stopNarration() {
  if (synth) synth.cancel();
}

function generateProphecy() {
  const h = hash(Date.now().toString());
  const r = rng(h);
  let prophecy = pick(PROPHECIES, r);
  
  // Replace placeholders
  const faction = pick(FACTIONS, r);
  const region = pick(REGIONS, r);
  const villain = pick(NAMES, r);
  const villain2 = pick(NAMES, r);
  const rarity = pick(Object.values(RARITY), r);
  const power = pick(POWERS, r);
  
  prophecy = prophecy.replace('{faction}', faction.name);
  prophecy = prophecy.replace('{region}', region.name);
  prophecy = prophecy.replace('{villain}', villain);
  prophecy = prophecy.replace('{villain2}', villain2);
  prophecy = prophecy.replace('{rarity}', rarity.name);
  prophecy = prophecy.replace('{power}', power.toLowerCase());
  
  return prophecy;
}

function checkHiddenVillains() {
  const now = new Date();
  const revelations = [];
  
  // Check each hidden villain
  HIDDEN_VILLAINS.forEach(hv => {
    if (state.ach.has('hidden_' + hv.name.toLowerCase().replace(/ /g, '_'))) return;
    
    let revealed = false;
    
    if (hv.condition.includes('midnight') && now.getHours() === 0 && now.getMinutes() === 0) revealed = true;
    if (hv.condition.includes('100 villains') && state.total >= 100) revealed = true;
    
    if (revealed) {
      state.ach.add('hidden_' + hv.name.toLowerCase().replace(/ /g, '_'));
      revelations.push(hv);
    }
  });
  
  return revelations;
}

function drawFace(cx, hy, rx, ry, s, h1, h2, ac, p, r) {
  const face = getFace(r);
  const hair = getHair(r);
  const expr = getExpression(r);
  const acc = getAccessory(r);
  
  // Face shape
  ctx.globalAlpha = p * 0.85;
  
  // Hair (behind head)
  if (hair.id !== 'none') {
    ctx.fillStyle = 'hsl(' + h2 + ',30%,8%)';
    if (hair.id === 'short' || hair.id === 'bun') {
      ctx.beginPath();
      ctx.ellipse(cx, hy - ry * 0.7, rx * 0.9, ry * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (hair.id === 'long' || hair.id === 'wild') {
      ctx.beginPath();
      ctx.ellipse(cx, hy - ry * 0.5, rx * 1.1, ry * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (hair.id === 'mohawk') {
      ctx.beginPath();
      ctx.moveTo(cx, hy - ry * 1.2);
      ctx.lineTo(cx - rx * 0.3, hy - ry * 0.5);
      ctx.lineTo(cx + rx * 0.3, hy - ry * 0.5);
      ctx.closePath();
      ctx.fill();
    }
  }
  
  // Head shape based on face type
  ctx.fillStyle = 'hsl(' + h1 + ',45%,20%)';
  if (face.id === 'angular') {
    ctx.beginPath();
    ctx.moveTo(cx - rx, hy - ry * 0.3);
    ctx.lineTo(cx - rx * 0.7, hy - ry);
    ctx.lineTo(cx + rx * 0.7, hy - ry);
    ctx.lineTo(cx + rx, hy - ry * 0.3);
    ctx.lineTo(cx + rx * 0.8, hy + ry * 0.5);
    ctx.lineTo(cx, hy + ry);
    ctx.lineTo(cx - rx * 0.8, hy + ry * 0.5);
    ctx.closePath();
    ctx.fill();
  } else if (face.id === 'round') {
    ctx.beginPath();
    ctx.ellipse(cx, hy, rx * 0.9, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (face.id === 'long') {
    ctx.beginPath();
    ctx.ellipse(cx, hy, rx * 0.7, ry * 1.1, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (face.id === 'square') {
    ctx.beginPath();
    ctx.rect(cx - rx * 0.8, hy - ry, rx * 1.6, ry * 2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.ellipse(cx, hy, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Face shadow
  ctx.globalAlpha = p * 0.45;
  const sh = ctx.createLinearGradient(cx - rx, hy, cx + rx, hy);
  sh.addColorStop(0, 'rgba(0,0,0,0.8)');
  sh.addColorStop(0.35, 'rgba(0,0,0,0.15)');
  sh.addColorStop(0.5, 'rgba(0,0,0,0)');
  sh.addColorStop(0.65, 'rgba(0,0,0,0.15)');
  sh.addColorStop(1, 'rgba(0,0,0,0.8)');
  ctx.fillStyle = sh;
  ctx.beginPath();
  ctx.ellipse(cx, hy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Eyes based on expression
  ctx.globalAlpha = p;
  const ey = hy - 10 * s, es = 25 * s, eg = Math.sin(F * 0.03) * 0.3 + 0.7;
  
  // Eye whites
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.beginPath();
  ctx.ellipse(cx - es, ey, 12 * s, 6 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + es, ey, 12 * s, 6 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Iris
  ctx.fillStyle = 'hsla(' + ac + ',100%,60%,' + eg + ')';
  ctx.shadowColor = 'hsl(' + ac + ',100%,60%)';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.ellipse(cx - es, ey, 6 * s, 4 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + es, ey, 6 * s, 4 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Pupils
  ctx.fillStyle = 'hsl(' + ac + ',100%,85%)';
  ctx.beginPath();
  ctx.ellipse(cx - es, ey, 3 * s, 3 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + es, ey, 3 * s, 3 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Expression-based eye modifications
  if (expr.id === 'angry') {
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.moveTo(cx - es - 8 * s, ey - 8 * s);
    ctx.lineTo(cx - es + 8 * s, ey - 4 * s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + es + 8 * s, ey - 8 * s);
    ctx.lineTo(cx + es - 8 * s, ey - 4 * s);
    ctx.stroke();
  } else if (expr.id === 'smirk') {
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.arc(cx + es * 0.5, hy + 10 * s, 8 * s, 0, Math.PI);
    ctx.stroke();
  }
  
  // Accessories
  if (acc.id === 'scar') {
    ctx.strokeStyle = 'rgba(255,0,0,0.4)';
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.moveTo(cx - es - 5 * s, ey - 10 * s);
    ctx.lineTo(cx - es + 10 * s, ey + 10 * s);
    ctx.stroke();
  } else if (acc.id === 'eyepatch') {
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(cx - es, ey, 14 * s, 8 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (acc.id === 'horns') {
    ctx.fillStyle = 'hsl(' + h2 + ',30%,10%)';
    ctx.beginPath();
    ctx.moveTo(cx - rx * 0.6, hy - ry * 0.8);
    ctx.lineTo(cx - rx * 0.8, hy - ry * 1.3);
    ctx.lineTo(cx - rx * 0.4, hy - ry * 0.7);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + rx * 0.6, hy - ry * 0.8);
    ctx.lineTo(cx + rx * 0.8, hy - ry * 1.3);
    ctx.lineTo(cx + rx * 0.4, hy - ry * 0.7);
    ctx.fill();
  } else if (acc.id === 'crown') {
    ctx.fillStyle = '#ff9f0a';
    ctx.beginPath();
    ctx.moveTo(cx - rx * 0.5, hy - ry * 0.9);
    ctx.lineTo(cx - rx * 0.3, hy - ry * 1.2);
    ctx.lineTo(cx, hy - ry * 1.0);
    ctx.lineTo(cx + rx * 0.3, hy - ry * 1.2);
    ctx.lineTo(cx + rx * 0.5, hy - ry * 0.9);
    ctx.closePath();
    ctx.fill();
  } else if (acc.id === 'tattoos') {
    ctx.strokeStyle = 'rgba(255,45,85,0.3)';
    ctx.lineWidth = 1 * s;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(cx - rx * 0.5 + i * rx * 0.25, hy + ry * 0.3, 3 * s, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  
  ctx.restore();
}

function generate(name, trigger) {
  const h = hash(name.toLowerCase() + '|' + trigger);
  const r = rng(h);
  const villain = pick(NAMES, r);
  const epithet = pick(EPITHETS, r);
  const power = pick(POWERS, r);
  const threat = pick(THREATS, r);
  const quote = pick(QUOTES, r);
  const template = pick(STORY_TEMPLATES, r);
  const backstory = template.replace(/{name}/g, name).replace(/{trigger}/g, trigger).replace("{villain}", villain).replace("{power}", power.toLowerCase());
  const rarity = rollRarity(r);

// ===== UPDATE STATE =====
function updateState(arc) {
  state.total++; state.session++;
  const key = arc.villainName + '|' + arc.epithet;
  if (!state.collected.has(key)) { state.unique++; state.collected.add(key); }
  state.poses.add(state.pose || 'tendrils');
  state.threats.add(arc.threat.l);
  if (new Date().getHours() < 6) state.night = true;
  const today = new Date().toDateString();
  if (state.lastVisit !== today) {
    const y = new Date(Date.now() - 86400000).toDateString();
    state.streak = state.lastVisit === y ? state.streak + 1 : 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    state.lastVisit = today;
  }
  state.history.unshift({ n: arc.villainName, e: arc.epithet, p: arc.power, t: arc.threat.l, r: arc.rarity, f: arc.faction, g: arc.region, d: Date.now() });
  state.factions.add(arc.faction.id);
  if (state.history.length > 50) state.history.pop();
  checkAch(); save();
}

function checkAch() {
  ACH.forEach(a => { if (!state.ach.has(a.id) && a.c(state)) { state.ach.add(a.id); toastAch(a); } });
  updateUI();
}

let actx = null, master = null;
function initAudio() {
  if (actx) return;
  actx = new (AudioContext || webkitAudioContext)();
  master = actx.createGain(); master.gain.value = 0.2; master.connect(actx.destination);
}
function tone(f, d, t, v) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = t || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, actx.currentTime);
  g.gain.linearRampToValueAtTime(v || 0.08, actx.currentTime + d * 0.2);
  g.gain.linearRampToValueAtTime(0, actx.currentTime + d);
  o.connect(g); g.connect(master); o.start(); o.stop(actx.currentTime + d);
}
function noise(d, v) {
  if (!actx) return;
  const b = actx.createBuffer(1, actx.sampleRate * d, actx.sampleRate);
  const d2 = b.getChannelData(0);
  for (let i = 0; i < d2.length; i++) d2[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d2.length, 2);
  const s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
  s.buffer = b; f.type = 'lowpass'; f.frequency.value = 300;
  g.gain.value = v || 0.1; s.connect(f); f.connect(g); g.connect(master); s.start();
}
function sfxImpact() { noise(0.3, 0.2); tone(50, 0.4, 'sawtooth', 0.15); tone(25, 0.5, 'sine', 0.1); }
function sfxRise() { tone(200, 2, 'sine', 0.05); tone(400, 2, 'sine', 0.03); setTimeout(() => tone(600, 1.5, 'sine', 0.02), 400); }

class P {

  u() { this.x += this.vx; this.y += this.vy; this.l -= this.d; if (this.l <= 0) this.r(); }
  d_() {
    ctx.globalAlpha = this.l * 0.4;
    ctx.fillStyle = 'hsl(' + this.h + ',80%,55%)';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, 6.283); ctx.fill();
    ctx.globalAlpha = this.l * 0.1;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.s * 4, 0, 6.283); ctx.fill();
  }
}
class E {
  constructor() { this.r(); }
  r() { this.x = Math.random() * W; this.y = H + 20; this.vx = (Math.random() - 0.5) * 0.8; this.vy = -Math.random() * 2.5 - 1; this.s = Math.random() * 2.5 + 0.8; this.l = 1; this.d = Math.random() * 0.005 + 0.002; this.sw = Math.random() * 6.283; }
  u() { this.x += this.vx + Math.sin(F * 0.012 + this.sw) * 0.3; this.y += this.vy; this.vy *= 0.992; this.l -= this.d; if (this.l <= 0) this.r(); }
  d_() {
    ctx.globalAlpha = this.l * 0.7;
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.s * 3);
    g.addColorStop(0, '#ff9f0a'); g.addColorStop(0.4, '#ff2d55'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, this.s * 3, 0, 6.283); ctx.fill();
  }
}

    ctx.save(); ctx.globalAlpha = p * 0.5;
    const vg = ctx.createRadialGradient(cx, cy * 0.7, 0, cx, cy * 0.7, 180 * s);
    vg.addColorStop(0, 'hsla(' + h1 + ',50%,3%,0.85)'); vg.addColorStop(0.6, 'hsla(' + h1 + ',30%,2%,0.4)'); vg.addColorStop(1, 'transparent');
    ctx.fillStyle = vg; ctx.beginPath(); ctx.arc(cx, cy * 0.7, 180 * s, 0, 6.283); ctx.fill();
    ctx.restore();
  }

  ctx.save(); ctx.globalAlpha = p * 0.85;

  // Shoulders with breathing
  const shoulderY = cy + 100 * s + breath * 50 * s;
  ctx.fillStyle = 'hsl(' + h2 + ',25%,9%)';
  ctx.beginPath(); ctx.moveTo(cx - 200 * s * clickScale, H);
  ctx.quadraticCurveTo(cx - 150 * s, shoulderY, cx - 80 * s, cy + 80 * s + breath * 30 * s);
  ctx.quadraticCurveTo(cx, cy + 50 * s + breath * 20 * s, cx + 80 * s, cy + 80 * s + breath * 30 * s);
  ctx.quadraticCurveTo(cx + 150 * s, shoulderY, cx + 200 * s * clickScale, H); ctx.fill();

  // Tendrils
  if (pose === 'tendrils') {
    for (let i = 0; i < 5; i++) {
      const side = i < 2 ? -1 : i > 2 ? 1 : 0;
      const bx = cx + side * (50 + i * 22) * s;
      ctx.fillStyle = 'hsla(' + h2 + ',25%,7%,0.8)'; ctx.beginPath(); ctx.moveTo(bx, cy + 80 * s);
      const w = Math.sin(F * 0.018 + i * 0.7) * 25 * s;
      ctx.quadraticCurveTo(bx + w, cy + 200 * s, bx + side * 50 * s + w * 0.5, H);
      ctx.lineTo(bx + 35 * s * side, H); ctx.fill();
    }
  }

  // Neck
  ctx.fillStyle = 'hsl(' + h1 + ',35%,16%)'; ctx.fillRect(cx - 30 * s, cy + 20 * s + breath * 20 * s, 60 * s, 80 * s);

  // Head with breathing
  const hy = cy - 60 * s + headBreath, rx = 70 * s + r() * 15 * s, ry = 90 * s + r() * 12 * s;
  
  // Draw detailed face
  drawFace(cx, hy, rx, ry, s, h1, h2, ac, p, r);

  // Mask
  if (r() > 0.55) {
    ctx.globalAlpha = p * 0.6; ctx.fillStyle = 'hsl(' + h2 + ',18%,10%)';
    ctx.beginPath(); ctx.ellipse(cx, hy + 22 * s, rx * 0.8, ry * 0.32, 0, 0, Math.PI); ctx.fill();
  }

  ctx.restore();

  // Energy tendrils
  ctx.save(); ctx.globalAlpha = p * 0.4; ctx.strokeStyle = 'hsl(' + ac + ',85%,55%)'; ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * 6.283 + F * 0.003, l = 100 * s + Math.sin(F * 0.015 + i) * 30 * s;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 80 * s, cy * 0.7 + Math.sin(a) * 60 * s);
    ctx.quadraticCurveTo(cx + Math.cos(a + 0.2) * l * 0.7, cy * 0.7 + Math.sin(a + 0.2) * l * 0.5, cx + Math.cos(a) * l, cy * 0.7 + Math.sin(a) * l);
    ctx.stroke();
  }
  ctx.restore();

  // Orbs
  if (pose === 'orbs') {
    ctx.save(); ctx.globalAlpha = p * 0.6;
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * 6.283 + F * 0.004, rd = 120 * s + Math.sin(F * 0.01 + i) * 30 * s;
      const px = cx + Math.cos(a) * rd, py = cy * 0.7 + Math.sin(a) * rd * 0.8;
      const sz = 3 + Math.sin(F * 0.02 + i) * 1.5;
      ctx.fillStyle = 'hsla(' + (ac + i * 30) % 360 + ',90%,65%,0.8)';
      ctx.beginPath(); ctx.arc(px, py, sz, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }

  // Spiral
  if (pose === 'spiral') {
    ctx.save(); ctx.globalAlpha = p * 0.5;
    for (let i = 0; i < 25; i++) {
      const a = (i / 25) * 18.85 + F * 0.018, rd = i * 8 * s;
      ctx.fillStyle = 'hsla(' + ac + ',85%,65%,' + (1 - i / 25) + ')';
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * rd, cy * 0.7 + Math.sin(a) * rd * 0.8, 2.5 * (1 - i / 25) + 0.8, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }

  // Lightning
  if (pose === 'lightning') {
    ctx.save(); ctx.globalAlpha = p * 0.7; ctx.strokeStyle = '#ff2d55'; ctx.lineWidth = 1.5; ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 15;
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * 6.283 + F * 0.002;
      ctx.beginPath(); ctx.moveTo(cx, cy - 50 * s);
      for (let j = 1; j <= 5; j++) { ctx.lineTo(cx + Math.cos(a + j * 0.25) * j * 30 * s, cy - 50 * s + j * 40 * s); }
      ctx.stroke();
    }
    ctx.restore();
  }

  // Shatter
  if (pose === 'shatter') {
    ctx.save(); ctx.globalAlpha = p * 0.5;
    for (let i = 0; i < 15; i++) {
      const a = (i / 15) * 6.283, d = (100 + Math.sin(F * 0.025 + i) * 20) * s;
      const px = cx + Math.cos(a) * d, py = cy * 0.7 + Math.sin(a) * d * 0.8;
      const sz = (5 + Math.sin(i) * 3) * s;
      ctx.fillStyle = 'hsla(' + h1 + ',60%,45%,0.7)'; ctx.save(); ctx.translate(px, py); ctx.rotate(F * 0.015 + i);
      ctx.fillRect(-sz / 2, -sz / 2, sz, sz * 0.6); ctx.restore();
    }
    ctx.restore();
  }
}

// ===== OVERLAYS =====
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, W * 0.25, W / 2, H / 2, W * 0.85);
  g.addColorStop(0, 'transparent'); g.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function scanlines() { ctx.fillStyle = 'rgba(0,0,0,0.02)'; for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1); }
function grain() { for (let i = 0; i < 40; i++) { const x = Math.random() * W, y = Math.random() * H; ctx.fillStyle = 'rgba(255,255,255,' + Math.random() * 0.05 + ')'; ctx.fillRect(x, y, 1, 1); } }
function bars() { const h = H * 0.05; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, h); ctx.fillRect(0, H - h, W, h); }

// ===== MAIN LOOP =====
function loop() {
  F++;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, W, H);

  parts.forEach(p => { p.u(); p.d_(); });
  embs.forEach(e => { e.u(); e.d_(); });

  if (mode === 'processing') {
    tProg = Math.min(tProg + 0.01, 1);
    prog = Math.min(prog + 0.007, 1);
    drawPort(prog);
    if (tProg < 0.5) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - tProg * 2) + ')'; ctx.fillRect(0, 0, W, H); }
    const rr = 100 + Math.sin(F * 0.05) * 20;
    ctx.strokeStyle = 'rgba(255,45,85,' + (0.3 + Math.sin(F * 0.05) * 0.2) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(W / 2, H / 2, rr, 0, 6.283); ctx.stroke();
  }

  if (mode === 'portrait') {
    drawPort(1);
    if (txtI < txtQ.length) {
      const el = Date.now() - txtT, idx = Math.floor(el / 1500);
      if (idx > txtI) { txtI = idx; sfxText(); }
      for (let i = 0; i <= Math.min(txtI, txtQ.length - 1); i++) {
        const t = txtQ[i], fp = i === txtI ? Math.min((el - i * 1500) / 500, 1) : 1;
        ctx.save(); ctx.globalAlpha = fp; ctx.font = t.f; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = t.c; ctx.shadowColor = t.g || '#ff2d55'; ctx.shadowBlur = 25;
        ctx.fillText(t.t, W / 2, t.y); ctx.restore();
      }
    }
  }

  vignette(); bars();
  if (mode !== 'idle') { scanlines(); grain(); }

  requestAnimationFrame(loop);
}

// ===== UI =====
const $ = id => document.getElementById(id);
function updateUI() {
  const level = Math.floor(state.total / 5) + 1;
  $('s-level').textContent = level;
  $('s-total').textContent = state.total;
  $('s-unique').textContent = state.unique;
  $('s-streak').textContent = state.streak;
  $('p-fill').style.width = Math.round(state.ach.size / ACH.length * 100) + '%';
  $('p-label').textContent = state.ach.size + '/' + ACH.length + ' achievements';
  $('b-nemesis').disabled = state.unique < 3;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
function toastAch(a) { $('ach-text').textContent = a.name; $('ach-toast').classList.add('show'); sfxChord([400, 600, 800]); setTimeout(() => $('ach-toast').classList.remove('show'), 3000); }
function openModal(id) { $('m-' + id).classList.add('active'); }
function closeModal(id) { $('m-' + id).classList.remove('active'); }
['daily', 'gallery', 'awards', 'share', 'universe'].forEach(m => { $('c-' + m).addEventListener('click', () => closeModal(m)); $('m-' + m).addEventListener('click', e => { if (e.target === $('m-' + m)) closeModal(m); }); });

// Reveal
function startReveal() {
  initAudio(); sfxImpact();
  const name = $('name-input').value.trim();
  if (!name) return;
  curName = name;

  $('stage').classList.remove('active');
  mode = 'processing'; tProg = 0; prog = 0; txtI = 0;
  arc = generate(name, 'The Awakening');
  pose = POSES[hash(name) % POSES.length];
  state.pose = pose;
  updateState(arc);

  const fs = Math.min(W, H) / 25;
  const rarity = RARITY[arc.rarity];
  const evo = getEvolution(state.total + 1);
  txtQ = [
    { t: rarity.name.toUpperCase(), y: H * 0.12, f: 'bold ' + fs * 0.25 + 'px Cinzel', c: rarity.color, g: rarity.glow },
    { t: evo.name.toUpperCase(), y: H * 0.17, f: 'bold ' + fs * 0.2 + 'px Cinzel', c: evo.color, g: '0 0 15px ' + evo.color },
    { t: 'ORIGIN STORY', y: H * 0.22, f: 'bold ' + fs * 0.35 + 'px Cinzel', c: '#ff2d55', g: '#ff2d55' },
    { t: arc.villainName.toUpperCase(), y: H * 0.33, f: 'bold ' + fs * 0.55 + 'px Cinzel', c: '#ffffff', g: rarity.glow },
    { t: '"' + arc.epithet + '"', y: H * 0.41, f: 'italic ' + fs * 0.3 + 'px Cormorant Garamond', c: '#bf5af2', g: '#bf5af2' },
    { t: arc.threat.l + ' — ' + arc.threat.n, y: H * 0.78, f: 'bold ' + fs * 0.25 + 'px Cinzel', c: arc.threat.c, g: arc.threat.c },
    { t: arc.power, y: H * 0.85, f: fs * 0.22 + 'px Cinzel', c: '#30d158', g: '#30d158' },
    { t: '"' + arc.quote + '"', y: H * 0.93, f: 'italic ' + fs * 0.22 + 'px Cormorant Garamond', c: '#a0a0a0', g: '#666' }
  ];
  txtT = Date.now();
  sfxRise();

  setTimeout(() => { mode = 'portrait'; sfxChord([100, 150, 200, 300]); }, 3500);
  setTimeout(() => {
    $('result').innerHTML = '<span class="result-main" style="text-shadow:' + rarity.glow + '">' + arc.villainName + '</span><span class="result-sub">' + rarity.name + ' • ' + evo.name + ' • ' + arc.epithet + ' • Threat: ' + arc.threat.l + ' • ' + arc.power + '</span>';
    $('result').classList.add('show');
  }, 12000);
}

// Nemesis
function startNemesis() {
  if (state.unique < 3) { toast('Collect 3 unique villains first!'); return; }
  const last = state.history[0];
  if (!last) return;
  initAudio(); sfxImpact();
  $('nemesis-banner').classList.add('show');
  setTimeout(() => {
    $('nemesis-banner').classList.remove('show');
    curName = last.n;
    arc = nemesisFor(last.n);
    pose = 'lightning';
    state.pose = pose;
    state.nemesis++; state.total++; state.session++;
    const key = arc.villainName + '|' + arc.epithet;
    if (!state.collected.has(key)) { state.unique++; state.collected.add(key); }
    state.poses.add(pose);
    state.threats.add(arc.threat.l);
    state.history.unshift({ n: arc.villainName, e: arc.epithet, p: arc.power, t: arc.threat.l, d: Date.now() });
    if (state.history.length > 50) state.history.pop();
    checkAch(); save();

    const fs = Math.min(W, H) / 25;
    txtQ = [
      { t: 'NEMESIS', y: H * 0.18, f: 'bold ' + fs * 0.3 + 'px Cinzel', c: '#ff2d55', g: '#ff2d55' },
      { t: arc.villainName.toUpperCase(), y: H * 0.32, f: 'bold ' + fs * 0.5 + 'px Cinzel', c: '#ffffff', g: '#ff2d55' },
      { t: '"' + arc.epithet + '"', y: H * 0.4, f: 'italic ' + fs * 0.28 + 'px Cormorant Garamond', c: '#bf5af2', g: '#bf5af2' },
      { t: arc.threat.l + ' — ' + arc.threat.n, y: H * 0.78, f: 'bold ' + fs * 0.25 + 'px Cinzel', c: arc.threat.c, g: arc.threat.c },
      { t: arc.power, y: H * 0.85, f: fs * 0.2 + 'px Cinzel', c: '#30d158', g: '#30d158' },
      { t: '"' + arc.quote + '"', y: H * 0.93, f: 'italic ' + fs * 0.2 + 'px Cormorant Garamond', c: '#a0a0a0', g: '#666' }
    ];
    txtT = Date.now(); txtI = 0;
    mode = 'processing'; tProg = 0; prog = 0;
    $('stage').classList.remove('active');
    sfxRise();
    setTimeout(() => { mode = 'portrait'; sfxChord([100, 150, 200, 300]); }, 3500);
    setTimeout(() => {
      $('result').innerHTML = '<span class="result-main">' + arc.villainName + '</span><span class="result-sub">' + arc.epithet + ' • Threat: ' + arc.threat.l + ' • ' + arc.power + '</span>';
      $('result').classList.add('show');
    }, 12000);
  }, 2000);
}

// Relationships
function showRelationships() {
  if (state.history.length < 2) { toast('Generate at least 2 villains to see relationships!'); return; }
  const c = $('universe-content'); c.innerHTML = '';
  
  const seen = new Set();
  const pairs = [];
  for (let i = 0; i < Math.min(state.history.length, 10); i++) {
    for (let j = i + 1; j < Math.min(state.history.length, 10); j++) {
      const h1 = state.history[i], h2 = state.history[j];
      const k = h1.n + '|' + h2.n;
      if (seen.has(k)) continue;
      seen.add(k);
      const rel = getRelationship(h1, h2);
      pairs.push({ v1: h1.n, v2: h2.n, rel, story: getRelationshipStory(h1.n, h2.n, rel) });
    }
  }
  
  pairs.slice(0, 6).forEach(p => {
    c.innerHTML += '<div class="rel-card"><span class="rel-icon">' + p.rel.icon + '</span><span class="rel-type">' + p.rel.name + '</span><span class="rel-villains">' + p.v1 + ' & ' + p.v2 + '</span><span class="rel-story">' + p.story + '</span></div>';
  });
  
  openModal('universe');
}

// Universe
function showUniverse() {
  const c = $('universe-content'); c.innerHTML = '';
  
  // Factions section
  c.innerHTML += '<h4 style="color:#ff2d55;margin-bottom:0.8rem">FACTIONS</h4>';
  FACTIONS.forEach(f => {
    const count = state.history.filter(h => h.f && h.f.id === f.id).length;
    c.innerHTML += '<div class="universe-faction" style="border-left:3px solid ' + f.color + '"><span class="faction-name" style="color:' + f.color + '">' + f.name + '</span><span class="faction-desc">' + f.desc + '</span><span class="faction-count">' + count + ' members</span></div>';
  });
  
  // Regions section
  c.innerHTML += '<h4 style="color:#ff2d55;margin:1.5rem 0 0.8rem">REGIONS</h4>';
  REGIONS.forEach(r => {
    const count = state.history.filter(h => h.g && h.g.id === r.id).length;
    c.innerHTML += '<div class="universe-region"><span class="region-name">' + r.name + '</span><span class="region-desc">' + r.desc + '</span><span class="region-count">' + count + ' villains</span></div>';
  });
  
  // Stats
  c.innerHTML += '<div class="universe-stats"><div class="stat-box"><span class="stat-num">' + state.factions.size + '</span><span class="stat-l">Factions</span></div><div class="stat-box"><span class="stat-num">' + state.unique + '</span><span class="stat-l">Villains</span></div></div>';
  
  openModal('universe');
}

// Daily
function showDaily() {
  const d = dailyVillain();
  $('daily-card').innerHTML = '<div class="daily-name">' + d.villainName + '</div><div class="daily-epithet">"' + d.epithet + '"</div><div class="daily-power">' + d.power + '</div><div class="daily-threat" style="color:' + d.threat.c + '">' + d.threat.l + ' - ' + d.threat.n + '</div>';
  $('daily-quote').textContent = '"' + d.quote + '"';
  openModal('daily');
  state.daily++; checkAch(); save();
}

// Gallery
function showGallery() {
  const g = $('gallery-grid'); g.innerHTML = '';
  if (!state.history.length) { g.innerHTML = '<p class="empty-msg">No villains yet. Generate one!</p>'; }
  else {
    const seen = new Set();
    state.history.forEach(h => {
      const k = h.n + '|' + h.e;
      if (seen.has(k)) return;
      seen.add(k);
      const rc = h.r === 'mythic' ? '#ff2d55' : h.r === 'legendary' ? '#ff9f0a' : h.r === 'epic' ? '#bf5af2' : h.r === 'rare' ? '#64d2ff' : h.r === 'uncommon' ? '#30d158' : '#a0a0a0';
      g.innerHTML += '<div class="gallery-card"><div class="gallery-name">' + h.n + '</div><div class="gallery-epithet">' + h.e + '</div><div class="gallery-threat" style="color:' + (h.t === 'S' ? '#ff2d55' : h.t === 'A' ? '#ff9f0a' : h.t === 'B' ? '#ffcc00' : h.t === 'C' ? '#64d2ff' : '#a0a0a0') + '">' + h.t + '</div><div class="gallery-rarity" style="color:' + rc + '">' + (h.r || 'common') + '</div><div class="gallery-faction" style="color:' + (h.f ? h.f.color : '#666') + '">' + (h.f ? h.f.name : '') + '</div></div>';
    });
  }
  openModal('gallery');
}

// Awards
function showAwards() {
  const g = $('awards-grid'); g.innerHTML = '';
  ACH.forEach(a => {
    const u = state.ach.has(a.id);
    g.innerHTML += '<div class="ach-card ' + (u ? 'unlocked' : '') + '"><span class="ach-icon">' + (u ? a.icon : '🔒') + '</span><span class="ach-name">' + a.name + '</span><span class="ach-desc">' + a.desc + '</span></div>';
  });
  openModal('awards');
}

// Share
function shareCopy() {
  if (!arc) return;
  const txt = 'I am ' + arc.villainName + ', "' + arc.epithet + '". Threat: ' + arc.threat.l + ' • ' + arc.power + '\n\nDiscover your villain arc: ' + location.href;
  navigator.clipboard.writeText(txt).then(() => { toast('Copied!'); state.shared++; checkAch(); save(); });
}
function shareTwitter() {
  if (!arc) return;
  const txt = 'I am ' + arc.villainName + ', "' + arc.epithet + '". Threat Level: ' + arc.threat.l + '. What\'s YOUR villain arc?';
  window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(txt) + '&url=' + encodeURIComponent(location.href), '_blank');
  state.shared++; checkAch(); save();
}
function shareDownload() {
  const a = document.createElement('a'); a.download = 'villain-arc-' + Date.now() + '.png';
  a.href = cv.toDataURL('image/png'); a.click(); toast('Image saved!');
}

// Video Recording
let mediaRecorder = null, recordedChunks = [];
function toggleRec() {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') {
    const stream = cv.captureStream(30);
    const opt = { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 5000000 };
    if (!MediaRecorder.isTypeSupported(opt.mimeType)) opt.mimeType = 'video/webm';
    mediaRecorder = new MediaRecorder(stream, opt); recordedChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const a = document.createElement('a'); a.download = 'villain-arc-' + Date.now() + '.webm';
      a.href = URL.createObjectURL(blob); a.click(); URL.revokeObjectURL(a.href); toast('Video saved!');
    };
    mediaRecorder.start(); $('b-rec').classList.add('recording'); $('b-rec').textContent = '⏹ STOP'; toast('Recording...');
  } else { mediaRecorder.stop(); $('b-rec').classList.remove('recording'); $('b-rec').textContent = '⏺ REC'; }
}

// Events
$('btn-reveal').addEventListener('click', startReveal);
$('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') startReveal(); });
$('b-daily').addEventListener('click', showDaily);
$('b-universe').addEventListener('click', showUniverse);
$('b-relations').addEventListener('click', showRelationships);
$('b-tournament').addEventListener('click', showTournament);
$('b-hidden').addEventListener('click', showHiddenVillains);
$('b-prophecy').addEventListener('click', showProphecy);
$('b-legacy').addEventListener('click', showLegacy);
$('b-merch').addEventListener('click', showMerch);
$('b-narration').addEventListener('click', () => { initSpeech(); showNarration(); });
$('b-nemesis').addEventListener('click', startNemesis);
$('b-gallery').addEventListener('click', showGallery);
$('b-awards').addEventListener('click', showAwards);
$('b-share').addEventListener('click', () => openModal('share'));
$('b-rec').addEventListener('click', toggleRec);
$('b-down').addEventListener('click', shareDownload);
$('sh-copy').addEventListener('click', () => { shareCopy(); closeModal('share'); });
$('sh-twitter').addEventListener('click', () => { shareTwitter(); closeModal('share'); });
$('sh-download').addEventListener('click', () => { shareDownload(); closeModal('share'); });

// Narration buttons (delegation)
document.addEventListener('click', (e) => {
  if (e.target.closest('.voice-btn')) {
    const voice = e.target.closest('.voice-btn').dataset.voice;
    narrateStory(voice);
  }
  if (e.target.closest('#btn-stop')) {
    stopNarration();
  }
});

// Init
updateUI();
setTimeout(() => $('stage').classList.add('active'), 500);
setTimeout(() => $('btn-reveal').classList.add('show'), 2500);
loop();
</script>
